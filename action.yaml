# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: "🔎 Gerrit Change Visible"
description: >-
  Reports whether a Gerrit change is visible to the account that will
  vote on it, so a workflow can skip a change it cannot read.

# A change is "visible" when the querying account can read it, in any
# status: merged and abandoned changes are visible. "Not visible" is a
# verdict (the change is private, or does not exist, as far as that
# account can tell). Anything else, such as an SSH failure, a bad
# credential or a response this action cannot interpret, FAILS the step
# rather than reporting "not visible", so a broken check can never read
# as a reason to skip verification.
#
# Two modes:
#   ssh  (default) Runs 'gerrit query' as the voting account. This is the
#                  production semantic: visibility as the account that
#                  clears and sets the vote.
#   rest           Anonymous GET of /changes/<n>. Needs no credential, so
#                  it can run where secrets are unavailable, but it only
#                  reports what an anonymous user sees.

inputs:
  gerrit-change-number:
    description: >-
      Gerrit change number: digits, with no leading zero
    required: true
  mode:
    description: >-
      How to query Gerrit: 'ssh' (as the voting account) or 'rest'
      (anonymous)
    required: false
    default: "ssh"
  host:
    description: "Gerrit SSH host name (mode 'ssh')"
    required: false
    default: ""
  port:
    description: "Gerrit SSH port (mode 'ssh')"
    required: false
    default: "29418"
  username:
    description: "Gerrit SSH user name (mode 'ssh')"
    required: false
    default: ""
  key:
    description: "SSH private key of the account (mode 'ssh')"
    required: false
    default: ""
  known_hosts:
    description: >-
      known_hosts entry for the Gerrit host (mode 'ssh'). For a
      non-default port the entry names the port, as 'ssh-keyscan -p'
      writes it: '[gerrit.example.org]:29418 ssh-ed25519 ...'
    required: false
    default: ""
  gerrit-url:
    description: >-
      Gerrit base URL, https only, with no trailing slash and including
      any path prefix, e.g. https://gerrit.linuxfoundation.org/infra
      (mode 'rest')
    required: false
    default: ""
  fail-if-not-visible:
    description: >-
      Fail the step when the change is not visible: 'true' or 'false'
    required: false
    default: "false"
  timeout:
    description: "Seconds to allow each query attempt, 1 to 300"
    required: false
    default: "30"

outputs:
  visible:
    description: >-
      'true' when the account can read the change, otherwise 'false'
    value: ${{ steps.check.outputs.visible }}
  status:
    description: >-
      The change status (NEW, MERGED, ABANDONED) when visible; empty
      otherwise
    value: ${{ steps.check.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: "Check change visibility"
      id: check
      shell: bash
      # Every value reaches the script through 'env', never by
      # interpolation into the script body.
      env:
        INPUT_CHANGE_NUMBER: ${{ inputs.gerrit-change-number }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_KEY: ${{ inputs.key }}
        INPUT_KNOWN_HOSTS: ${{ inputs.known_hosts }}
        INPUT_GERRIT_URL: ${{ inputs.gerrit-url }}
        INPUT_FAIL_IF_NOT_VISIBLE: ${{ inputs.fail-if-not-visible }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
      run: |
        # Check change visibility
        "$GITHUB_ACTION_PATH/scripts/check.sh"
